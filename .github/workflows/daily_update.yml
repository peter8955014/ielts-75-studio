name: Daily Update IELTS Vocab & Quiz Bank

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 00:00 (台灣時間 08:00) 自動更新詞庫與題庫
  workflow_dispatch:     # 支援在 GitHub 網頁手動一鍵觸發更新

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run English DB updater
        run: python update_english_db.py

      - name: Commit and push updated JSON files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add vocab.json ielts_bank.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: daily auto-update IELTS vocab & quiz bank" && git push)
